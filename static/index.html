<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汛期闸门容量批次调度</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}
pre{background:#f4f7f9;padding:1rem;overflow:auto}
button{padding:.5rem 1rem;margin:.2rem}
</style>
</head>
<body>
<h1>汛期闸门容量批次调度</h1>
<p>指令绑定时段、闸门组合与下泄量，按剩余过流能力先到先占；容量不足进入待排队并写明缺口。水情或闸门状态变化触发整时段FIFO失效重算，已执行指令保留当时快照。</p>
<button onclick="load('/api/gates')">闸门与有效能力</button>
<button onclick="load('/api/orders')">调度指令</button>
<button onclick="load('/api/audit')">审计链</button>
<pre id="out">使用 X-Actor / X-Role 请求头（duty_officer / chief_engineer / dispatcher / viewer）调用接口。</pre>
<script>
async function load(path){
  const r = await fetch(path, {headers:{'X-Actor':'demo','X-Role':'viewer'}});
  document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
